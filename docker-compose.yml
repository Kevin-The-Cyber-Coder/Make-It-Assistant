services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: make_it_ai
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      WORKER_PORT: 4100
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_BIN_DIR: /app/node_modules/.bin
    ports:
      - "4100:4100"

volumes:
  mongo-data:
  redis-data:
