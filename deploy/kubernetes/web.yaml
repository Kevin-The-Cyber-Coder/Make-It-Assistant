apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: make-it-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/kevin-the-cyber-coder/make-it-assistant-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: make-it-ai
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
