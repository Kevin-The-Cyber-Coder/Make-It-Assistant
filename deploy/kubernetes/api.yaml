apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: make-it-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/kevin-the-cyber-coder/make-it-assistant-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: mia-config
            - secretRef:
                name: mia-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: make-it-ai
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
