apiVersion: v1
kind: ConfigMap
metadata:
  name: mia-config
  namespace: make-it-ai
data:
  NODE_ENV: "production"
  PORT: "4000"
  API_PREFIX: "/api/v1"
  # Replace with the real public origin before deploying.
  CLIENT_ORIGIN: "https://make-it-ai.example.com"
  MONGODB_DB: "make_it_ai"
  GITHUB_OAUTH_REDIRECT_URI: "https://make-it-ai.example.com/api/v1/github/oauth/callback"
  GITHUB_OAUTH_COOKIE_SAMESITE: "lax"
  SANDBOX_URL: "http://worker:4100"
  SANDBOX_TIMEOUT_MS: "120000"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "120"
