name: Pull Request checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  status:
    name: Publish repository status
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate status report
        run: node scripts/compliance-report.mjs --output pr-status.md

      - name: Comment with real status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = [
              '### Repository status (generated by CI)',
              '',
              fs.readFileSync('pr-status.md', 'utf8'),
              '',
              '> This comment reports repository state only. It is not a review approval or a claim of external validation.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes('### Repository status (generated by CI)'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
